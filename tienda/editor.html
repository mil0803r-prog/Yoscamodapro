<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de tu tienda</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--crema:#FAF0E8;--arena:#F6E3D6;--terra:#9C5C40;--cafe:#6E3F2C;--tinta:#2A2220;--gris:#7A6A62;--borde:#EADFD6;--ok:#2E7D32;--bg:#F7F2EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:var(--bg);display:flex;flex-direction:column;font-size:14.5px}
button{font-family:inherit}
/* ---- barra superior ---- */
header{background:#fff;border-bottom:1px solid var(--borde);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:8px;flex:1;min-width:190px}
.marca .lp{font-size:20px}
.marca b{display:block;font-size:16px;line-height:1.1}.marca small{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris)}
#estado{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gris);font-weight:500}
#estado i{width:8px;height:8px;border-radius:50%;background:#2E7D32}
body.sucio #estado{color:#B45309;font-weight:600}body.sucio #estado i{background:#D97706}
.bt{border:1px solid var(--borde);background:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--tinta);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.bt:hover{background:#FBF7F2}
.bt.pri{background:var(--cafe);border-color:var(--cafe);color:#fff;font-weight:600}.bt.pri:hover{background:#5d3323}
.bt:disabled{opacity:.45;cursor:default}
/* ---- 3 columnas ---- */
#app{flex:1;min-height:0;display:grid;grid-template-columns:190px minmax(300px,430px) minmax(0,1fr)}
nav{background:#fff;border-right:1px solid var(--borde);overflow-y:auto;padding:12px 8px 8px;display:flex;flex-direction:column;min-width:0}
nav .gr{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#A89A91;padding:12px 10px 6px;font-weight:600}
nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px;color:var(--tinta);cursor:pointer;text-align:left}
nav button .e{width:20px;text-align:center;font-size:15px}
nav button:hover{background:#FBF7F2}
nav button.on{background:var(--arena);color:var(--terra);font-weight:600}
#conexion{margin-top:auto;padding:12px 10px;font-size:11.5px;color:var(--gris);border-top:1px solid var(--borde);display:flex;gap:6px;align-items:center}
#editor{overflow-y:auto;padding:22px 22px 80px;background:#FCF9F5;border-right:1px solid var(--borde);min-width:0}
#editor h2{font-family:"Playfair Display",Georgia,serif;font-size:25px;font-weight:600;margin-bottom:4px}
#editor .desc{color:var(--gris);margin-bottom:16px;line-height:1.45}
#editor .desc b{color:var(--tinta)}
.barra{display:flex;gap:8px;margin-bottom:12px}
.barra input{flex:1}
/* ---- campos ---- */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.etq{font-size:12.5px;color:var(--gris);font-weight:500}
.f small,.h{font-size:11.5px;color:var(--gris)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=search],textarea,select{width:100%;border:1px solid var(--borde);border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--tinta);min-width:0}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--terra);outline-offset:-1px}
input.mal{border-color:#C62828;background:#FFF5F5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g1{display:grid;gap:10px}
.pre{display:flex;align-items:center;border:1px solid var(--borde);border-radius:8px;background:#fff;padding-left:11px}
.pre span{color:var(--gris)}.pre input{border:0;outline:0!important}
.selcolor{display:flex;gap:8px}
.selcolor input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--borde);border-radius:8px;background:#fff;cursor:pointer;flex:none}
.selcolor input[type=text]{text-transform:uppercase}
.tit{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--cafe);font-weight:700;margin:16px 0 8px}
.tit:first-child{margin-top:0}
/* ---- prendas ---- */
.fila{background:#fff;border:1px solid var(--borde);border-radius:12px;margin-bottom:8px;overflow:hidden}
.fila.oculta .cab{opacity:.55}
.cab{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.th{width:42px;height:50px;border-radius:7px;background-size:cover;background-position:center top;border:1px solid var(--borde);flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--gris);font-size:12px}
.pr{text-align:right;flex:none}.pr b{display:block;font-size:14.5px}.pr s{color:var(--gris);font-size:12px;display:block}
.ins{font-size:11.5px;border-radius:99px;padding:3px 9px;font-weight:600;flex:none}
.ins.ok{background:#E3F1E4;color:#256B2B}.ins.low{background:#FBE3E3;color:#B42323}.ins.nc{background:#EFE9E3;color:var(--gris)}.ins.of{background:#EFE9E3;color:var(--gris)}
.chev{color:var(--gris);font-size:16px;transition:transform .15s;flex:none}
.fila.abierta .chev{transform:rotate(180deg)}
.cuerpo{display:none;padding:4px 14px 16px;background:#FCF9F5;border-top:1px solid var(--borde)}
.fila.abierta .cuerpo{display:block}
.sws{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:4px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.sw input{position:absolute;opacity:0}
.sw i{width:38px;height:22px;border-radius:99px;background:#CBBFB6;position:relative;transition:.15s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{left:19px}
.sw input:focus-visible+i{outline:2px solid var(--terra);outline-offset:2px}
.tallas{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.tallas .f label{text-align:center;font-weight:700;color:var(--tinta)}.tallas input{text-align:center}
.todos{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px;margin-bottom:12px}
.todos label{font-size:13px;flex:1 1 100%;color:var(--gris)}.todos .pre{flex:1;min-width:110px}
/* ---- tarjetas simples ---- */
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:10px}
.card h4{font-size:14.5px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h4 span{font-weight:400;color:var(--gris);font-size:12.5px}
.paletas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--gris);margin-bottom:12px}
.pal{display:flex;align-items:center;gap:5px;border:1px solid var(--borde);background:#fff;border-radius:99px;padding:5px 11px 5px 7px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--tinta)}
.pal i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}.pal i+i{margin-left:-9px}
.formas{display:flex;gap:10px;flex-wrap:wrap}
.forma input{position:absolute;opacity:0}
.forma .b{display:inline-block;padding:12px 22px;background:var(--tinta);color:#fff;font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;border:3px solid transparent;cursor:pointer}
.forma .b.cuadrado{border-radius:2px}.forma .b.redondeado{border-radius:10px}.forma .b.pildora{border-radius:999px}
.forma input:checked+.b{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--terra)}
.tabla{display:grid;gap:6px;align-items:center}.tabla b{font-size:12px;color:var(--gris)}
.aviso{background:#FFF7E6;border:1px solid #F3DFB0;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.45}
.guardar{display:grid;gap:10px;max-width:420px}
#estNube{font-size:13.5px;color:var(--gris);min-height:18px}
/* ---- vista previa ---- */
#lienzo{min-width:0;min-height:0;display:flex;flex-direction:column;background:#EFE6DE}
#barraV{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--gris)}
#disp{display:flex;gap:4px;margin-left:auto}
#disp button{border:1px solid var(--borde);background:#fff;border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer}
#disp button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
#vista{flex:1;min-height:0;display:flex;justify-content:center}
#vista iframe{border:0;background:#fff;width:100%;height:100%}
#lienzo[data-disp=cel] #vista{padding:10px 0}
#lienzo[data-disp=cel] #vista iframe{width:390px;max-width:100%;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.25);border:8px solid #1c1c1c}
body.soloprevia #app{grid-template-columns:0 0 1fr}body.soloprevia nav,body.soloprevia #editor{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
#toast[hidden]{display:none}
@media(max-width:1020px){
 #app{grid-template-columns:150px minmax(0,1fr)}
 #lienzo{display:none}
 body.soloprevia #app{grid-template-columns:1fr}body.soloprevia #lienzo{display:flex}
}
@media(max-width:700px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
 nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px;border-right:0;border-bottom:1px solid var(--borde);gap:4px}
 nav .gr,#conexion{display:none}nav button{width:auto;white-space:nowrap;flex:none}
 #editor{padding:16px 14px 80px}
 .g2{grid-template-columns:1fr}
}
</style><script>window.RUTA_FOTOS="./";</script><script src="./config.js"></script><script src="./datos.js"></script></head><body ><header>

<script>
/* Si la nube está configurada, se parte de los datos que ya están publicados; si no, de datos.js */

  const N=window.YOSCA_NUBE||{};if(!N.url||!N.clave)return;
  try{const r=await fetch(N.url.replace(/\/+$/,"")+"/rest/v1/tiendas?id=eq."+encodeURIComponent(N.tienda||"yosca")+"&select=datos",{headers:{apikey:N.clave,Authorization:"Bearer "+N.clave},cache:"no-store"});
    if(r.ok){const f=await r.json();const d=f&&f[0]&&f[0].datos;if(d&&Array.isArray(d.productos))window.YOSCA=d}}catch(e){}
}
</script><script>/* ===== EDITOR DE TU TIENDA (manual): solo cambia lo que YA existe ===== */
window.__iniciarPanel=function(){
'use strict';

function nube(){const N=window.YOSCA_NUBE||{};if(N.url&&N.clave)return N;try{const L=JSON.parse(localStorage.getItem('yosca_tienda_nube'));if(L&&L.url&&L.clave)return L}catch(e){}return N}
const dinero=n=>mon()+Number(n||0).toFixed(2);
let uid=0;

/* ---------- piezas ---------- */
function campo(label,ruta,o={}){
  const {tipo='text',hint='',ph='',max=0}=o,id='c'+(++uid),v=g(ruta);

  if(tipo==='number')return `<div class="f"><label for="${id}">${label}</label><div class="pre"><span>${esc(mon())}</span><input id="${id}" type="number" inputmode="decimal" min="0" step="0.1" data-p="${ruta}" data-k="num" value="${v==null?'':esc(v)}" placeholder="${esc(ph)}"></div>${hint?`<small>${hint}</small>`:''}</div>`;
  if(tipo==='color')return `<div class="f"><label for="${id}">${label}</label><div class="selcolor"><input type="color" data-p="${ruta}" data-k="color" value="${hexOk(v)?esc(v):'#000000'}" aria-label="${esc(label)}"><input id="${id}" type="text" data-p="${ruta}" data-k="hex" value="${esc(v)}" maxlength="7" spellcheck="false"></div>${hint?`<small>${hint}</small>`:''}</div>`;
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="text" data-p="${ruta}" data-k="text" value="${esc(v)}" ${max?`maxlength="${max}"`:''} placeholder="${esc(ph)}">${hint?`<small>${hint}</small>`:''}</div>`;

const tarj=(t,c,extra='')=>`<div class="card"><h4>${t}${extra}</h4>${c}</div>`;

/* ---------- prendas ---------- */
const catDe=p=>(D.categorias||[]).find(c=>c.id===p.categoria)||{nombre:'',detalle:''};
function infoStock(p){
  const tl=D.tallas||[],st=p.stock||{},vals=tl.map(t=>st[t]).filter(v=>v!==''&&v!=null).map(Number);
  if(!vals.length)return {txt:'Sin control',c:'nc'};

  const tallas=(D.tallas||[]).map(t=>`<div class="f"><label for="st${i}${t}">${esc(t)}</label><input id="st${i}${t}" type="number" min="0" step="1" inputmode="numeric" data-p="productos.${i}.stock.${t}" data-k="stockn" value="${p.stock&&p.stock[t]!=null&&p.stock[t]!==''?esc(p.stock[t]):''}" placeholder="—"></div>`).join('');

  <div class="cuerpo"><div class="tit">Datos básicos</div>
   <div class="g1">${campo('Nombre de la prenda','productos.'+i+'.nombre',{max:60})}

  </div></div>`;

function updFila(i){

const COL=[['crema','Fondo de la página','Fondo claro de la portada.'],['arena','Fondo suave','Tarjetas y detalles.'],['terracota','Color principal','Botones al pasar el mouse.'],['cafe','Barra superior y pie','Franja de anuncios y final de la página.'],['acento','Color de detalles','Palabras destacadas y subrayados.'],['tinta','Textos y botones oscuros','Letras y botones principales.']];

const FORMAS=[['cuadrado','Cuadrado'],['redondeado','Redondeado'],['pildora','Pastilla']];

const NAV=[['TU CATÁLOGO',['prendas','🛍️'],['categorias','🗂️'],['packs','🎁']],['TU PÁGINA',['portada','🏠'],['anuncio','📣'],['comprar','🛒'],['tallas','📏'],['faq','❓']],['AJUSTES',['contacto','💬'],['marca','🎨'],['publicar','💾']]];
function menu(){
  $('#menu').innerHTML=NAV.map(([gr,...its])=>`<div class="gr">${gr}</div>`+its.map(([id,e])=>`<button type="button" data-pg="${id}" class="${id===pagina?'on':''}"><span class="e">${e}</span>${esc(P[id].t)}</button>`).join('')).join('')+`<div id="conexion">${(nube().url)?'☁️ Nube conectada':'📁 Sin nube conectada'}</div>`;
}
function dibujar(){
  uid=0;const pg=P[pagina];
  $('#editor').innerHTML=`<h2>${esc(pg.t)}</h2>`+pg.h();
  menu();
  if(pagina==='publicar'){const N=nube();if(N.url&&N.clave){$('#nUrl').value=N.url;$('#nClave').value=N.clave;$('#nTienda').value=N.tienda||'yosca'}}
  $('#subm').textContent=((D.marca.logo||'')+' '+(D.marca.logoSub||'')).trim();
}
function irPagina(id){pagina=id;dibujar();$('#editor').scrollTop=0;irA(P[id].ir)}

/* ---------- vista previa ---------- */
const marco=$('#marco');let lista=false;
function paraPrevia(){const c=JSON.parse(JSON.stringify(D));const f=x=>FOTOS[x]||x;if(c.portada)c.portada.foto=f(c.portada.foto);(c.categorias||[]).forEach(k=>k.foto=f(k.foto));if(c.tarjetaPacks)c.tarjetaPacks.foto=f(c.tarjetaPacks.foto);(c.productos||[]).forEach(p=>p.foto=f(p.foto));return c}
function previa(){if(marco.contentWindow&&lista)marco.contentWindow.postMessage({tipo:'yosca-datos',datos:paraPrevia()},'*')}
function irA(id){if(marco.contentWindow&&lista&&id)marco.contentWindow.postMessage({tipo:'yosca-ir',id},'*')}
window.addEventListener('message',e=>{if(e.data&&e.data.tipo==='yosca-lista'){lista=true;previa()}});
function estado(){const c=JSON.stringify(D)!==BASE;$('#contador').textContent=c?'Cambios sin guardar':'Sin cambios';$('#btnGuardar').disabled=!c;$('#btnDeshacer').disabled=!pila.length;document.body.classList.toggle('sucio',c);const a=$('#avisoGuardar');if(a)a.textContent=c?'Tienes cambios sin guardar.':'No hay cambios pendientes.'}

/* ---------- cambios ---------- */
function aplicar(el){
  const r=el.dataset.p,k=el.dataset.k;if(!r)return;
  if(pendiente==null)pendiente=JSON.stringify(D);
  const mf=r.match(/^productos\.(\d+)\./);
  if(k==='num'){const v=el.value===''?null:Math.max(0,Math.min(99999,parseFloat(el.value)));s(r,Number.isFinite(v)?v:null)}
  else if(k==='color'){const v=el.value.toUpperCase();s(r,v);const t=el.parentNode.querySelector('input[type=text]');if(t)t.value=v}
  else if(k==='hex'){let v=el.value.trim();if(v&&v[0]!=='#')v='#'+v;el.value=v;if(!hexOk(v)){el.classList.add('mal');return}el.classList.remove('mal');s(r,v.toUpperCase());const c=el.parentNode.querySelector('input[type=color]');if(c)c.value=v}
  else if(k==='visible')s(r,!!el.checked);
  else if(k==='agotado'){s(r,el.checked?Object.fromEntries((D.tallas||[]).map(x=>[x,0])):{});if(mf){(D.tallas||[]).forEach(t=>{const i=document.getElementById('st'+mf[1]+t);if(i)i.value=el.checked?'0':''})}}
  else if(k==='stockn'){const m=r.match(/^productos\.(\d+)\.stock\.(.+)$/);const p=D.productos[+m[1]];if(!p.stock||typeof p.stock!=='object')p.stock={};if(el.value==='')delete p.stock[m[2]];else p.stock[m[2]]=Math.max(0,Math.floor(parseFloat(el.value)||0));
    const ag=document.querySelector('.fila[data-i="'+m[1]+'"] [data-k=agotado]');if(ag)ag.checked=infoStock(p).txt==='Agotado'}
  else if(k==='bool')s(r,!!el.checked);
  else if(k==='radio'){if(el.checked)s(r,el.value)}
  else s(r,el.value);
  clearTimeout(tSnap);tSnap=setTimeout(()=>{if(pendiente!=null&&pendiente!==JSON.stringify(D))pila.push(pendiente);pendiente=null;if(pila.length>60)pila.shift();estado()},700);
  clearTimeout(tVista);tVista=setTimeout(()=>{if(mf)updFila(+mf[1]);previa();estado();$('#subm').textContent=((D.marca.logo||'')+' '+(D.marca.logoSub||'')).trim();
    if(/^packs\.\d+\.precio$/.test(r)){const i=+r.split('.')[1],x=D.packs[i],c=document.querySelectorAll('.card h4 .cu')[i];if(c)c.textContent=x.cantidad>0?dinero(x.precio/x.cantidad)+' c/u':''}},120);
}
const ed=$('#editor');
ed.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.p&&el.dataset.k!=='radio'&&el.type!=='checkbox'&&el.tagName!=='SELECT')aplicar(el)});
ed.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.p&&(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT'))aplicar(el)});
ed.addEventListener('click',e=>{
  const ab=e.target.closest('[data-abrir]');
  if(ab){const i=+ab.dataset.abrir,f=ab.closest('.fila');f.classList.toggle('abierta');f.classList.contains('abierta')?filasAbiertas.add(i):filasAbiertas.delete(i);return}
  const pal=e.target.closest('.pal');
  if(pal){const v=pal.dataset.pal.split(',');pila.push(JSON.stringify(D));['crema','arena','terracota','cafe','acento','tinta'].forEach((k,i)=>s('marca.colores.'+k,v[i]));dibujar();previa();estado();return}
  if(e.target.id==='aplicarTodos'){const v=parseFloat($('#precioTodos').value);if(!(v>=0)){toast('Escribe el precio que quieres poner');return}
    pila.push(JSON.stringify(D));(D.productos||[]).forEach((_,i)=>s('productos.'+i+'.precio',v));dibujar();previa();estado();toast('Todas las prendas están en '+dinero(v));return}
  if(e.target.id==='btnDescargar')descargar();
  if(e.target.id==='btnNube')guardarNube();
});
ed.addEventListener('input',e=>{if(e.target.id==='buscar'){const q=e.target.value.trim().toLowerCase();ed.querySelectorAll('.fila').forEach(f=>f.style.display=!q||f.dataset.q.includes(q)?'':'none')}});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-pg]');if(b)irPagina(b.dataset.pg)});
$('#btnDeshacer').addEventListener('click',()=>{if(!pila.length)return;D=JSON.parse(pila.pop());dibujar();previa();estado()});
$('#btnGuardar').addEventListener('click',()=>irPagina('publicar'));
$('#btnPrev').addEventListener('click',()=>{const on=document.body.classList.toggle('soloprevia');$('#btnPrev').textContent=on?'✏️ Volver a editar':'👁 Vista previa';if(on)setTimeout(previa,50)});
$('#disp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#disp button').forEach(x=>x.classList.toggle('on',x===b));$('#lienzo').dataset.disp=b.dataset.d});
if(window.FOTOS_PREVIA){const a=$('#btnAbrir');a.removeAttribute('href');a.addEventListener('click',()=>toast('En tu tienda real, este botón abre tu página.'))}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}

/* ---------- guardar ---------- */
const textoDatos=()=>'/* Datos de la tienda — generados por el Editor de tu tienda. */\nwindow.YOSCA = '+JSON.stringify(D,null,2)+';\n';
function descargar(){const b=new Blob([textoDatos()],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='datos.js';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Descargado: reemplaza datos.js en tu carpeta web')}
async function guardarNube(){
  const N=nube();
  const url=($('#nUrl').value||N.url||'').trim().replace(/\/+$/,''),clave=($('#nClave').value||N.clave||'').trim(),tienda=($('#nTienda').value||N.tienda||'yosca').trim();
  const correo=$('#nCorreo').value.trim(),pass=$('#nPass').value,est=$('#estNube');
  if(!url||!clave||!correo||!pass){est.textContent='Completa la dirección, la clave pública, tu correo y tu contraseña.';return}
  est.textContent='Entrando…';$('#btnNube').disabled=true;
  try{
    const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:clave,'Content-Type':'application/json'},body:JSON.stringify({email:correo,password:pass})});
    if(!r.ok)throw new Error('Correo o contraseña incorrectos');
    const tk=(await r.json()).access_token;if(!tk)throw new Error('No se pudo iniciar sesión');
    est.textContent='Guardando…';
    const w=await fetch(url+'/rest/v1/tiendas?id=eq.'+encodeURIComponent(tienda),{method:'PATCH',headers:{apikey:clave,Authorization:'Bearer '+tk,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({datos:D})});
    if(!w.ok)throw new Error('No se pudo guardar ('+w.status+')');
    const filas=await w.json();if(!filas.length)throw new Error('No tienes permiso para esta tienda o no existe "'+tienda+'"');
    est.textContent='✓ Guardado. Tu tienda ya muestra los cambios.';$('#nPass').value='';BASE=JSON.stringify(D);pila.length=0;estado();
  }catch(e){est.textContent='✗ '+(e.message||'Error')}finally{const b=$('#btnNube');if(b)b.disabled=false}
}
window.addEventListener('beforeunload',e=>{if(JSON.stringify(D)!==BASE){e.preventDefault();e.returnValue=''}});

dibujar();estado();
window.__panel={get D(){return D},textoDatos};
};
</script><script>datosNube().finally(function(){window.__iniciarPanel()});</script></body></html>
